name: Release

# Builds the desktop installers for macOS, Windows and Linux and attaches them to a
# GitHub Release. Triggered by pushing a version tag (e.g. v1.0.0), or manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14            # Apple Silicon (M-series)
            target: aarch64-apple-darwin
          - platform: macos-13            # Intel Macs
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the DeutschX engine (Python sidecar)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python installer/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install

      - name: Build app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "DeutschX ${{ github.ref_name }}"
          releaseBody: |
            Download the installer for your system below.

            - **macOS** — `.dmg` (open it, drag DeutschX to Applications). First launch:
              right-click the app → **Open** → **Open** (one-time, because it's unsigned).
            - **Windows** — `.msi` or `-setup.exe`.
            - **Linux** — `.AppImage` (make it executable and run) or `.deb`.

            On first run, paste your own Anthropic API key. Everything stays on your machine.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
